[workspace]
members = ["crates/engine", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
