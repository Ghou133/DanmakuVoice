name: 发布已验证的构建产物

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag, for example v0.2.1'
        required: true
        type: string
      build_run_id:
        description: 'Windows build run ID with a successful windows job'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha > tag-commit.txt
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('build-run.json').read_text(encoding='utf-8'))
          jobs = json.loads(Path('build-jobs.json').read_text(encoding='utf-8'))['jobs']
          assert run['path'] == '.github/workflows/windows-portable.yml', 'Unexpected build workflow'
          assert run['event'] in ('push', 'workflow_dispatch'), 'Only trusted repository builds can publish'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected source repository'
          assert run['head_sha'] == Path('tag-commit.txt').read_text(encoding='utf-8').strip(), 'Build and tag commits differ'
          windows = [job for job in jobs if job['name'] == 'windows']
          assert len(windows) == 1 and windows[0]['conclusion'] == 'success', 'Windows validation must pass'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: DanmakuVoice-release-assets
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify assets and publish
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # Accept older Windows CRLF manifests and publish portable LF text.
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          from zipfile import ZipFile
          expected = {'DanmakuVoice-windows-x64.zip', 'DanmakuVoice.exe',
                      'DanmakuVoice-source.zip', 'DanmakuVoice-licenses.zip'}
          rows = [line.split('  ') for line in Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()]
          assert len(rows) == len(expected) and {name for _, name in rows} == expected, 'Unexpected checksum entries'
          for digest, name in rows:
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          Path('SHA256SUMS.txt').write_text(''.join(f'{digest}  {name}\n' for digest, name in rows), encoding='utf-8', newline='\n')
          with ZipFile('DanmakuVoice-windows-x64.zip') as archive:
              assert archive.namelist() == ['DanmakuVoice.exe'], 'ZIP must contain only the program'
              assert archive.read('DanmakuVoice.exe') == Path('DanmakuVoice.exe').read_bytes(), 'ZIP EXE differs'
          commit = Path('../tag-commit.txt').read_text(encoding='utf-8').strip()
          prefix = f'DanmakuVoice-source-{commit[:12]}/'
          with ZipFile('DanmakuVoice-source.zip') as archive:
              assert f'DanmakuVoice source commit: {commit}' in archive.read(prefix + 'SOURCE-COMMIT.txt').decode('utf-8-sig')
          PY
          # Resume only an identical complete draft; never overwrite assets or a
          # published release. Draft lookup uses its ID, not the public tag API.
          if ! release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl 2>/dev/null); then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "超绝可爱弹幕姬 $RELEASE_TAG" --notes-file RELEASE-NOTES.md \
              DanmakuVoice-windows-x64.zip DanmakuVoice.exe \
              DanmakuVoice-source.zip DanmakuVoice-licenses.zip SHA256SUMS.txt
            release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          fi
          gh api "$release_api" > uploaded.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          expected = {line.split('  ')[1] for line in Path('SHA256SUMS.txt').read_text(encoding='utf-8').splitlines()}
          expected.add('SHA256SUMS.txt')
          uploaded = json.loads(Path('uploaded.json').read_text(encoding='utf-8'))
          assert uploaded['draft'], 'Release must remain draft until verified'
          assert uploaded['tag_name'] == os.environ['RELEASE_TAG'], 'Release tag differs'
          assets = uploaded['assets']
          assert len(assets) == len(expected) and {a['name'] for a in assets} == expected, 'Unexpected release assets'
          for asset in assets:
              path = Path(asset['name'])
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size, path.name
              assert asset['digest'] == 'sha256:' + digest, path.name
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
