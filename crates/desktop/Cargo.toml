[package]
name = "danmakuvoice"
description = "超绝可爱弹幕姬 · 直播弹幕与语音播报"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
danmakuvoice-engine = { path = "../engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
qrcode = { version = "=0.14.1", default-features = false }
png = "0.18"
serde_json.workspace = true
serde.workspace = true
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["sync", "rt-multi-thread", "macros", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
semver = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39.1"
windows-core = "0.62"
windows = { version = "0.62", features = ["ApplicationModel"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
