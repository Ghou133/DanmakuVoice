<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>超绝可爱弹幕姬 · OBS 叠加层</title>
<style>
/* ============================================================================
   超绝可爱弹幕姬 · OBS 叠加层（实验性）
   Served only on 127.0.0.1 by the desktop app. All sizes are design pixels on
   a 1920×1080 canvas multiplied by --p, so 2K, 4K, 16:10 and ultrawide
   browser sources scale from their real size.
   ========================================================================== */
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Medium.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Black.woff2") format("woff2");font-weight:900;font-display:block}
@font-face{font-family:"DV Numeral";src:url("/overlay/fonts/InstrumentSerif-Regular.woff2") format("woff2");font-style:normal;font-display:block}
@font-face{font-family:"DV Numeral";src:url("/overlay/fonts/InstrumentSerif-Italic.woff2") format("woff2");font-style:italic;font-display:block}
:root{
  --p:1px;
  --vig:.6;
  /* 0 up to the default shade, 1 at the strongest: see applyConfig. */
  --vig-boost:0;
  --serif:"DV Serif","Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --numeral:"DV Numeral","Instrument Serif","Cambria","Georgia",serif;
  --sans:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --text:#f4f1fa; --muted:#cfc9dc; --dim:#b4b0c6; --faint:#6e6a80;
  --pink:#f2a7c3; --lilac:#c8b6f0; --blue:#a8bff3; --gold:#ebcb93; --ok:#8fd9b6;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.22,1.25,.36,1);
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --avs{syntax:"<length>";inherits:true;initial-value:20px}
@property --reveal{syntax:"<number>";inherits:true;initial-value:1}
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none}
.ov{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.ov.ready{opacity:1}
.ov.offline{opacity:0}

/* ---------- block: masthead + messages, anchored to a corner ---------- */
.block{position:absolute;width:calc(640*var(--p));display:flex;flex-direction:column;gap:calc(13*var(--p))}
.ov[data-corner^=t] .block{top:calc(48*var(--p))}
.ov[data-corner^=b] .block{bottom:calc(48*var(--p))}
.ov[data-corner$=l] .block{left:calc(72*var(--p))}
.ov[data-corner$=r] .block{right:calc(72*var(--p));align-items:flex-end;text-align:right}
.vig{position:absolute;z-index:-3;left:calc(-240*var(--p));top:calc(-180*var(--p));right:calc(60*var(--p));bottom:calc(-180*var(--p));border-radius:50%;
  background:radial-gradient(closest-side,rgba(8,7,13,calc(.86*var(--vig))),rgba(8,7,13,calc(.44*var(--vig) + .2*var(--vig-boost))) 50%,rgba(8,7,13,calc(.12*var(--vig) + .22*var(--vig-boost))) 78%,transparent);transition:opacity .8s ease}
.ov[data-corner$=r] .vig{left:calc(60*var(--p));right:calc(-240*var(--p))}

/* ---------- masthead (always on) ---------- */
.mast{position:relative;display:flex;flex-direction:column;gap:calc(13*var(--p))}
.ov[data-corner$=r] .mast{align-items:flex-end}
.kicker{position:relative;display:flex;align-items:center;gap:calc(11*var(--p));font-family:var(--numeral);font-size:calc(15*var(--p));letter-spacing:.34em;color:var(--dim);white-space:nowrap;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.7)}
.kicker .live{color:#ece8f5}
.kicker .sep{color:var(--faint);letter-spacing:0}
.kicker .time{font-style:italic;letter-spacing:.06em;font-size:calc(18*var(--p))}
.dot{width:calc(7*var(--p));height:calc(7*var(--p));border-radius:50%;background:var(--pink);flex:none;transition:background .6s ease}
.ov.connected .dot{animation:halo 7s ease-out infinite}
.ov.tts-off .dot{background:var(--blue)}
.ov.disconnected .dot{background:var(--faint);animation:none}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(242,167,195,.55)}60%{box-shadow:0 0 0 calc(8*var(--p)) rgba(242,167,195,0)}}
.title{font-family:var(--serif);font-weight:900;font-size:calc(50*var(--p));letter-spacing:.08em;line-height:1.1;white-space:nowrap;text-shadow:0 2px 2px rgba(0,0,0,.4),0 calc(6*var(--p)) calc(30*var(--p)) rgba(0,0,0,.6)}
.tagrow{display:flex;align-items:center;gap:calc(14*var(--p))}
.ov[data-corner$=r] .tagrow{flex-direction:row-reverse}
.rule{position:relative;width:calc(110*var(--p));height:calc(1.5*var(--p));overflow:hidden;flex:none;background:linear-gradient(90deg,var(--pink),var(--lilac) 55%,transparent)}
.ov[data-corner$=r] .rule{background:linear-gradient(270deg,var(--pink),var(--lilac) 55%,transparent)}
.rule::after{content:"";position:absolute;top:-1px;left:0;width:calc(40*var(--p));height:calc(4*var(--p));background:linear-gradient(90deg,transparent,#fff,transparent);animation:sheen 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sheen{0%,82%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.tagline{font-family:var(--numeral);font-style:italic;font-size:calc(19*var(--p));color:var(--muted);white-space:nowrap;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.85),0 0 calc(2*var(--p)) rgba(0,0,0,calc(.75*var(--vig-boost)));transition:opacity .4s ease}
.tagline.swap{opacity:0}
.tagline b{font-weight:400;color:var(--pink)}
.tagline .cn{font-family:var(--serif);font-style:normal;font-size:.9em;letter-spacing:.06em}

/* ---------- message list ---------- */
.list{position:relative;display:flex;flex-direction:column;gap:calc(14*var(--p));margin-top:calc(13*var(--p))}
.ov[data-corner$=r] .list{align-items:flex-end}
.item{position:relative;display:flex;gap:calc(14*var(--p));align-items:flex-start;max-width:100%;
  transition:opacity .6s ease,filter .45s ease;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.85),0 0 calc(2*var(--p)) rgba(0,0,0,calc(.75*var(--vig-boost)))}
.ov[data-corner$=r] .item{flex-direction:row-reverse}
.item.enter{animation:item-in .7s var(--ease) both}
@keyframes item-in{from{opacity:0;transform:translateY(calc(-8*var(--p))) scale(.98);filter:blur(6px)}}
.item.out{opacity:0!important;filter:blur(4px)}
.body{min-width:0;display:flex;flex-direction:column;gap:calc(3*var(--p))}
.meta{font-size:calc(13*var(--p));letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.meta:empty{display:none}
.meta .label{font-family:var(--numeral);letter-spacing:.3em;color:var(--gold)}
.item[data-kind=guard] .meta .label{color:var(--lilac)}
.meta .name{margin-left:.6em}
.text{font-size:calc(18*var(--p));line-height:1.6;overflow-wrap:anywhere;transition:font-size .52s var(--ease)}
.item.recent .text{font-family:var(--serif);font-weight:500;font-size:calc(22*var(--p));letter-spacing:.03em}
.item[data-kind=gift] .text,.item[data-kind=guard] .text{font-family:var(--serif);font-weight:700}
.num{font-family:var(--numeral);font-style:italic;color:var(--pink);font-size:1.3em;margin-left:.25em;font-weight:400;line-height:1}
.count{font-family:var(--numeral);font-style:italic;color:var(--pink);font-size:1.2em;margin-left:.35em}
.count:empty{display:none}
.item.bump .count{display:inline-block;animation:bump .5s var(--spring)}
@keyframes bump{35%{transform:scale(1.35) rotate(-6deg)}}
.emote{height:1.45em;vertical-align:-.34em;margin:0 .06em}
/* A line that is one emote and nothing else shows the emote itself in place of
   the text, sized by the line's place like text is; a repeat count sits at its
   foot instead of dropping below it. */
.sticker{--sticker:calc(72*var(--p));height:var(--sticker);width:auto;max-width:calc(3*var(--sticker));object-fit:contain;display:block;
  filter:drop-shadow(0 calc(4*var(--p)) calc(8*var(--p)) rgba(0,0,0,.4));transition:height .52s var(--ease),width .52s var(--ease)}
.sticker.emote-unavailable{width:var(--sticker);color:var(--dim)}
.text.solo{display:flex;align-items:flex-end;gap:calc(6*var(--p))}
.ov[data-corner$=r] .text.solo{justify-content:flex-end}
.text.solo .count{line-height:1;margin:0 0 calc(6*var(--p))}

/* avatar */
.av{position:relative;flex:none;border-radius:50%;width:calc(26*var(--p));height:calc(26*var(--p));margin-top:calc(2*var(--p));transition:width .52s var(--ease),height .52s var(--ease)}
.face,.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.face{background:radial-gradient(circle at 36% 46%,#3a2a3f 0 6%,transparent 7%),radial-gradient(circle at 64% 46%,#3a2a3f 0 6%,transparent 7%),radial-gradient(ellipse 15% 9% at 25% 61%,rgba(255,120,160,.5),transparent),radial-gradient(ellipse 15% 9% at 75% 61%,rgba(255,120,160,.5),transparent),linear-gradient(135deg,var(--c1),var(--c2))}
.ring{position:absolute;inset:calc(-4*var(--p));border-radius:50%;opacity:0;transition:opacity .5s ease;
  background:conic-gradient(from var(--a),var(--pink),var(--lilac),var(--blue),var(--pink));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5*var(--p)),#000 calc(100% - 2*var(--p)));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5*var(--p)),#000 calc(100% - 2*var(--p)))}
.item.reading .ring{opacity:1;animation:spin 3.2s linear infinite}
@keyframes spin{to{--a:360deg}}

/* spotlight item */
.item.spot .av{width:calc(40*var(--p));height:calc(40*var(--p))}
.item.spot .text{text-wrap:balance;font-family:var(--serif);font-weight:500;font-size:calc(30*var(--p));line-height:1.55;letter-spacing:.03em}
.item.spot[data-kind=gift] .text,.item.spot[data-kind=guard] .text{font-weight:700}
.lit{color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-size:var(--lit,100%) 100%;background-color:rgba(255,255,255,.34)}
.aura{position:absolute;z-index:-1;left:calc(-60*var(--p));right:calc(-60*var(--p));top:calc(-50*var(--p));bottom:calc(-50*var(--p));border-radius:50%;opacity:0;transition:opacity .8s ease;
  background:radial-gradient(closest-side,rgba(242,167,195,.24),transparent)}
.item.spot .aura{opacity:1;animation:aura 6s ease-in-out infinite}
@keyframes aura{0%,100%{transform:scale(.95)}50%{transform:scale(1.06) translate(calc(12*var(--p)),calc(-8*var(--p)))}}

/* progress: horizontal in the card, vertical on the spine */
.prog{display:none}
.comet{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(168,191,243,.5) 45%,transparent);pointer-events:none}

/* ======================== U3 · SPINE ========================
   A hair-thin thread of light. It carries at most three entries; with no
   new chat it keeps them, lets a slow light run down the thread and dims
   into a resting state instead of emptying the corner. */
.ov[data-style=spine] .block{padding-left:calc(32*var(--p))}
.ov[data-style=spine][data-corner$=r] .block{padding-left:0;padding-right:calc(32*var(--p))}
.spine{--head:0px;display:none;position:absolute;top:calc(10*var(--p));height:calc(140*var(--p));left:0;width:calc(1.5*var(--p));
  background:linear-gradient(180deg,rgba(214,200,246,.42),rgba(168,191,243,.26) calc(100% - 44*var(--p)),transparent);transition:opacity 2.4s ease,height .62s cubic-bezier(.22,.8,.24,1)}
/* The lead-in from the LIVE dot to the first avatar is always lit; each line
   then lights its own stretch below (see .prog). The tip glows past the newest. */
.spine .fill{position:absolute;left:0;top:0;width:100%;height:var(--head);background:linear-gradient(180deg,var(--pink),#f6d6e6);
  box-shadow:0 0 calc(6*var(--p)) rgba(242,167,195,.65);transition:height .62s cubic-bezier(.22,.8,.24,1)}
/* The socket: a hollow stop at the end of the thread where the next line will
   attach. It lights and counts when lines are waiting their turn. */
.spine .head{position:absolute;left:50%;top:var(--tip,0px);width:calc(11*var(--p));height:calc(11*var(--p));margin:calc(-5.5*var(--p)) 0 0 calc(-5.5*var(--p));border-radius:50%;box-sizing:border-box;
  border:calc(1.5*var(--p)) solid rgba(214,200,246,.45);background:rgba(13,12,19,.4);
  transition:top .62s cubic-bezier(.22,.8,.24,1),border-color .4s ease,background .4s ease,box-shadow .4s ease,opacity .4s ease}
.ov.waiting .spine .head{border-color:var(--pink);background:rgba(242,167,195,.3);box-shadow:0 0 calc(12*var(--p)) rgba(242,167,195,.5);animation:head-glow 1.8s ease-in-out infinite}
@keyframes head-glow{50%{box-shadow:0 0 calc(20*var(--p)) calc(3*var(--p)) rgba(242,167,195,.6)}}
.spine .more{position:absolute;left:calc(100% + 9*var(--p));top:50%;transform:translateY(-50%);font-family:var(--numeral);font-style:italic;font-weight:400;font-size:calc(16*var(--p));line-height:1;color:var(--pink);white-space:nowrap;
  text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.85);opacity:0;transition:opacity .3s ease}
.ov.waiting .spine .more{opacity:1}
.ov[data-corner$=r] .spine .more{left:auto;right:calc(100% + 9*var(--p))}
.ov.disconnected .spine .head{opacity:0}
.ov[data-style=spine] .spine{display:block}
.ov[data-style=spine][data-corner$=r] .spine{left:auto;right:0}
.flow{position:absolute;top:0;bottom:0;left:calc(-4*var(--p));width:calc(9.5*var(--p));overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 30*var(--p)),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 30*var(--p)),transparent)}
/* The idle light only runs while the overlay rests: with chat on screen every
   light on the thread stands for something (the next line, a line's time). */
.flow::before{content:"";position:absolute;left:0;right:0;top:0;height:100%;opacity:0;
  background:radial-gradient(calc(4.75*var(--p)) 7% at 50% 7%,rgba(255,255,255,.95),rgba(242,167,195,.45) 55%,transparent)}
@keyframes flow{0%{opacity:0;transform:translateY(-14%)}8%{opacity:1}55%{opacity:.75}66%,100%{opacity:0;transform:translateY(100%)}}
.ov.resting .flow::before{animation:flow 15s cubic-bezier(.45,.05,.3,1) 3s infinite}
.ov.resting .spine{opacity:.72}
.ov.disconnected .flow{display:none}
.ov[data-style=spine] .kicker .dot{position:absolute;left:calc(-32*var(--p) - 3.5*var(--p) + .75*var(--p))}
.ov[data-style=spine][data-corner$=r] .kicker .dot{left:auto;right:calc(-32*var(--p) - 3.5*var(--p) + .75*var(--p))}
/* The rule under the title is the thread's first branch: it leaves the thread
   in a curve, carries the lead-in's colour and glow and dims with the thread
   at rest. It has no light of its own: as the idle light passes the fork, a
   part of it runs out along the branch (--fork-at, set by traceThread). */
.ov[data-style=spine] .rule{overflow:visible;width:calc(128*var(--p));margin-left:calc(-18*var(--p));filter:drop-shadow(0 0 calc(3*var(--p)) rgba(242,167,195,.55));transition:opacity 2.4s ease}
.ov[data-style=spine][data-corner$=r] .rule{margin-left:0;margin-right:calc(-18*var(--p))}
.ov[data-style=spine] .rule::before{content:"";position:absolute;right:100%;bottom:0;width:calc(14*var(--p));height:calc(14*var(--p));box-sizing:border-box;
  border:0 solid var(--pink);border-left-width:calc(1.5*var(--p));border-bottom-width:calc(1.5*var(--p));border-bottom-left-radius:calc(14*var(--p))}
.ov[data-style=spine][data-corner$=r] .rule::before{right:auto;left:100%;border-left-width:0;border-right-width:calc(1.5*var(--p));border-bottom-left-radius:0;border-bottom-right-radius:calc(14*var(--p))}
.ov[data-style=spine] .rule::after{top:50%;left:calc(-15*var(--p));width:calc(30*var(--p));height:calc(9.5*var(--p));margin-top:calc(-4.75*var(--p));border-radius:50%;opacity:0;animation:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(242,167,195,.45) 55%,transparent)}
.ov[data-style=spine][data-corner$=r] .rule::after{left:auto;right:calc(-15*var(--p))}
.ov.resting[data-style=spine] .rule{opacity:.72}
.ov.resting[data-style=spine] .rule::before{animation:fork-glint 15s ease-out calc(var(--fork-at,6s) - .15s) infinite}
@keyframes fork-glint{0%,6%,100%{border-color:var(--pink)}2%{border-color:#fff4f8}}
.ov.resting[data-style=spine] .rule::after{animation:fork-light 15s linear var(--fork-at,6s) infinite}
.ov.resting[data-style=spine][data-corner$=r] .rule::after{animation-name:fork-light-r}
@keyframes fork-light{0%{opacity:0;transform:none;animation-timing-function:cubic-bezier(.3,.55,.45,1)}2%{opacity:1}13%,100%{opacity:0;transform:translateX(calc(124*var(--p)))}}
@keyframes fork-light-r{0%{opacity:0;transform:none;animation-timing-function:cubic-bezier(.3,.55,.45,1)}2%{opacity:1}13%,100%{opacity:0;transform:translateX(calc(-124*var(--p)))}}
.ov[data-style=spine] .list{gap:calc(16*var(--p));transition:opacity 2.4s ease}
.ov.resting[data-style=spine] .list{opacity:.9}
.ov[data-style=spine] .item{--avs:calc(20*var(--p));padding-left:calc(20*var(--p));align-self:flex-start;transition:--avs .52s var(--ease),opacity .6s ease,filter .45s ease}
.ov[data-style=spine][data-corner$=r] .item{padding-left:0;padding-right:calc(20*var(--p));align-self:flex-end}
.ov[data-style=spine] .item .av{position:absolute;left:calc(-32*var(--p) + .75*var(--p) - var(--avs)/2);top:calc(3*var(--p));margin:0;width:var(--avs);height:var(--avs);
  box-shadow:0 0 0 calc(1.5*var(--p)) rgba(255,255,255,.26),0 0 calc(14*var(--p)) rgba(242,167,195,.28),0 calc(2*var(--p)) calc(6*var(--p)) rgba(0,0,0,.45)}
.ov[data-style=spine][data-corner$=r] .item .av{left:auto;right:calc(-32*var(--p) + .75*var(--p) - var(--avs)/2)}
.ov[data-style=spine] .item.near{--avs:calc(24*var(--p))}
.ov[data-style=spine] .item.tip{--avs:calc(36*var(--p))}
.ov[data-style=spine] .item.tip .av{box-shadow:0 0 calc(18*var(--p)) rgba(242,167,195,.35),0 calc(3*var(--p)) calc(10*var(--p)) rgba(0,0,0,.45)}
/* Arrival: the socket at the end of the thread ignites and blooms into the
   new avatar; a branch of light leaves the avatar and the line is written out
   behind its head; the light then carries on down the thread to the next
   stop, where the socket reappears. --reveal drives the branch and the text
   together and rests at 1, so without motion the line is simply there. */
.ov[data-style=spine] .item.enter{animation:none}
.ov[data-style=spine] .item.arrive{animation:reveal .8s cubic-bezier(.4,.1,.25,1) .24s both}
@keyframes reveal{from{--reveal:0}to{--reveal:1}}
.ov[data-style=spine] .item.arrive .av{animation:bloom .62s var(--spring) both}
@keyframes bloom{from{transform:scale(.3);filter:brightness(2.4) saturate(.3)}45%{filter:brightness(1.5) saturate(.7)}}
.ov[data-style=spine] .item.arrive .av::after{content:"";position:absolute;inset:0;border-radius:50%;box-sizing:border-box;border:calc(1.5*var(--p)) solid rgba(255,238,246,.9);
  box-shadow:0 0 calc(10*var(--p)) rgba(242,167,195,.7);animation:ripple .9s cubic-bezier(.2,.7,.3,1) .1s both}
@keyframes ripple{from{transform:scale(.5);opacity:1}to{transform:scale(2.2);opacity:0}}
/* The text box grows by the halo while it is revealed, so the soft edge that
   follows the branch's head never clips the shadow. */
.ov[data-style=spine] .item.arrive .body{margin:calc(-12*var(--p));padding:calc(12*var(--p));
  --edge:calc(var(--avs)/2 - 39.25*var(--p) + var(--reveal)*(100% + 71.25*var(--p) - var(--avs)/2));
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--edge) - 32*var(--p)),transparent var(--edge));mask-image:linear-gradient(90deg,#000 calc(var(--edge) - 32*var(--p)),transparent var(--edge))}
.ov[data-style=spine][data-corner$=r] .item.arrive .body{-webkit-mask-image:linear-gradient(270deg,#000 calc(var(--edge) - 32*var(--p)),transparent var(--edge));mask-image:linear-gradient(270deg,#000 calc(var(--edge) - 32*var(--p)),transparent var(--edge))}
.beam{display:none}
