<title>超绝可爱弹幕姬 · OBS 叠加层</title>
<style>
/* ============================================================================
   超绝可爱弹幕姬 · OBS 叠加层（实验性）
   Served only on 127.0.0.1 by the desktop app. All sizes are design pixels on
   a 1920×1080 canvas multiplied by --p, so 2K, 4K, 16:10 and ultrawide
   browser sources scale from their real size.
   ========================================================================== */
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Medium.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Bold.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"DV Serif";src:url("/overlay/fonts/DanmakuVoiceSerifSC-Black.woff2") format("woff2");font-weight:900;font-display:block}
@font-face{font-family:"DV Numeral";src:url("/overlay/fonts/InstrumentSerif-Regular.woff2") format("woff2");font-style:normal;font-display:block}
@font-face{font-family:"DV Numeral";src:url("/overlay/fonts/InstrumentSerif-Italic.woff2") format("woff2");font-style:italic;font-display:block}
:root{
  --p:1px;
  --vig:.6;
  --serif:"DV Serif","Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  --numeral:"DV Numeral","Instrument Serif","Cambria","Georgia",serif;
  --sans:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  --text:#f4f1fa; --muted:#cfc9dc; --dim:#b4b0c6; --faint:#6e6a80;
  --pink:#f2a7c3; --lilac:#c8b6f0; --blue:#a8bff3; --gold:#ebcb93; --ok:#8fd9b6;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.22,1.25,.36,1);
}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%}
body{font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-synthesis:none}
.ov{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.ov.ready{opacity:1}
.ov.offline{opacity:0}

/* ---------- block: masthead + messages, anchored to a corner ---------- */
.block{position:absolute;width:calc(640*var(--p));display:flex;flex-direction:column;gap:calc(13*var(--p))}
.ov[data-corner^=t] .block{top:calc(48*var(--p))}
.ov[data-corner^=b] .block{bottom:calc(48*var(--p))}
.ov[data-corner$=l] .block{left:calc(72*var(--p))}

.vig{position:absolute;z-index:-3;left:calc(-260*var(--p));top:calc(-200*var(--p));right:calc(-260*var(--p));bottom:calc(-200*var(--p));border-radius:50%;
  background:radial-gradient(closest-side,rgba(8,7,13,calc(.95*var(--vig))),rgba(8,7,13,calc(.5*var(--vig))) 55%,transparent);transition:opacity .8s ease}

/* ---------- masthead (always on) ---------- */
.mast{position:relative;display:flex;flex-direction:column;gap:calc(13*var(--p))}
.ov[data-corner$=r] .mast{align-items:flex-end}
.kicker{position:relative;display:flex;align-items:center;gap:calc(11*var(--p));font-family:var(--numeral);font-size:calc(15*var(--p));letter-spacing:.34em;color:var(--dim);white-space:nowrap;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.7)}

.kicker .time{font-style:italic;letter-spacing:.06em;font-size:calc(18*var(--p))}
.dot{width:calc(7*var(--p));height:calc(7*var(--p));border-radius:50%;background:var(--pink);flex:none;transition:background .6s ease}
.ov.connected .dot{animation:halo 7s ease-out infinite}
.ov.tts-off .dot{background:var(--blue)}

.title{font-family:var(--serif);font-weight:900;font-size:calc(50*var(--p));letter-spacing:.08em;line-height:1.1;white-space:nowrap;text-shadow:0 2px 2px rgba(0,0,0,.4),0 calc(6*var(--p)) calc(30*var(--p)) rgba(0,0,0,.6)}
.tagrow{display:flex;align-items:center;gap:calc(14*var(--p))}
.ov[data-corner$=r] .tagrow{flex-direction:row-reverse}
.rule{position:relative;width:calc(110*var(--p));height:calc(1.5*var(--p));overflow:hidden;flex:none;background:linear-gradient(90deg,var(--pink),var(--lilac) 55%,transparent)}
.ov[data-corner$=r] .rule{background:linear-gradient(270deg,var(--pink),var(--lilac) 55%,transparent)}
.rule::after{content:"";position:absolute;top:-1px;left:0;width:calc(40*var(--p));height:calc(4*var(--p));background:linear-gradient(90deg,transparent,#fff,transparent);animation:sheen 9s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sheen{0%,82%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.tagline{font-family:var(--numeral);font-style:italic;font-size:calc(19*var(--p));color:var(--muted);white-space:nowrap;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.85);transition:opacity .4s ease}
.tagline.swap{opacity:0}

/* ---------- message list ---------- */
.list{position:relative;display:flex;flex-direction:column;gap:calc(14*var(--p));margin-top:calc(13*var(--p))}
.ov[data-corner$=r] .list{align-items:flex-end}
.item{position:relative;display:flex;gap:calc(14*var(--p));align-items:flex-start;max-width:100%;
  transition:opacity .6s ease,filter .45s ease;text-shadow:0 1px calc(8*var(--p)) rgba(0,0,0,.85)}

@keyframes item-in{from{opacity:0;transform:translateY(calc(-8*var(--p))) scale(.98);filter:blur(6px)}}

.body{min-width:0;display:flex;flex-direction:column;gap:calc(3*var(--p))}
.meta{font-size:calc(13*var(--p));letter-spacing:.14em;color:var(--dim);white-space:nowrap}
.meta:empty{display:none}
.meta .label{font-family:var(--numeral);letter-spacing:.3em;color:var(--gold)}
.item[data-kind=guard] .meta .label{color:var(--lilac)}
.meta .name{margin-left:.6em}
.text{font-size:calc(18*var(--p));line-height:1.6;overflow-wrap:anywhere;transition:font-size .52s var(--ease)}
.item.recent .text{font-family:var(--serif);font-weight:500;font-size:calc(22*var(--p));letter-spacing:.03em}
.item[data-kind=gift] .text,.item[data-kind=guard] .text{font-family:var(--serif);font-weight:700}
.num{font-family:var(--numeral);font-style:italic;color:var(--pink);font-size:1.3em;margin-left:.25em;font-weight:400;line-height:1}

.emote{height:1.45em;vertical-align:-.34em;margin:0 .06em}
.sticker{height:calc(96*var(--p));display:block;filter:drop-shadow(0 calc(4*var(--p)) calc(8*var(--p)) rgba(0,0,0,.4))}

/* avatar */
.av{position:relative;flex:none;border-radius:50%;width:calc(26*var(--p));height:calc(26*var(--p));margin-top:calc(2*var(--p));transition:width .52s var(--ease),height .52s var(--ease)}
.face,.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.face{background:radial-gradient(circle at 36% 46%,#3a2a3f 0 6%,transparent 7%),radial-gradient(circle at 64% 46%,#3a2a3f 0 6%,transparent 7%),radial-gradient(ellipse 15% 9% at 25% 61%,rgba(255,120,160,.5),transparent),radial-gradient(ellipse 15% 9% at 75% 61%,rgba(255,120,160,.5),transparent),linear-gradient(135deg,var(--c1),var(--c2))}

  background:conic-gradient(from var(--a),var(--pink),var(--lilac),var(--blue),var(--pink));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5*var(--p)),#000 calc(100% - 2*var(--p)));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5*var(--p)),#000 calc(100% - 2*var(--p)))}

@keyframes spin{to{--a:360deg}}

/* spotlight item */
.item.spot .av{width:calc(40*var(--p));height:calc(40*var(--p))}
.item.spot .text{text-wrap:balance;font-family:var(--serif);font-weight:500;font-size:calc(30*var(--p));line-height:1.55;letter-spacing:.03em}
.item.spot[data-kind=gift] .text,.item.spot[data-kind=guard] .text{font-weight:700}

  background-image:linear-gradient(#fff,#fff);background-repeat:no-repeat;background-size:var(--lit,100%) 100%;background-color:rgba(255,255,255,.34)}

  background:radial-gradient(closest-side,rgba(242,167,195,.24),transparent)}
.item.spot .aura{opacity:1;animation:aura 6s ease-in-out infinite}

/* progress: horizontal in the card, vertical on the spine */
.prog{display:none}
.comet{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(168,191,243,.5) 45%,transparent);pointer-events:none}

/* ======================== U3 · SPINE ======================== */
.ov[data-style=spine] .block{padding-left:calc(30*var(--p))}
.ov[data-style=spine][data-corner$=r] .block{padding-left:0;padding-right:calc(30*var(--p))}
.spine{display:none;position:absolute;top:calc(10*var(--p));bottom:calc(-24*var(--p));left:0;width:calc(2*var(--p));
  background:linear-gradient(180deg,rgba(242,167,195,.9),rgba(200,182,240,.55) 45%,rgba(168,191,243,.2) 85%,transparent)}

.ov[data-style=spine][data-corner$=r] .spine{left:auto;right:0}

.ov[data-style=spine][data-corner$=r] .kicker .dot{left:auto;right:calc(-30*var(--p) - 3.5*var(--p) + 1*var(--p))}
.ov[data-style=spine] .item{padding-left:calc(22*var(--p))}
.ov[data-style=spine][data-corner$=r] .item{padding-left:0;padding-right:calc(22*var(--p))}
.ov[data-style=spine] .item .av{position:absolute;left:calc(-30*var(--p) + 1*var(--p) - var(--avs)/2);top:calc(3*var(--p));margin:0;--avs:calc(22*var(--p));width:var(--avs);height:var(--avs);
  box-shadow:0 0 0 calc(3*var(--p)) rgba(13,12,19,.9)}
.ov[data-style=spine][data-corner$=r] .item .av{left:auto;right:calc(-30*var(--p) + 1*var(--p) - var(--avs)/2)}
.ov[data-style=spine] .item.recent .av{--avs:calc(28*var(--p))}
.ov[data-style=spine] .item.spot .av{--avs:calc(40*var(--p));box-shadow:none}
.ov[data-style=spine] .item.spot .prog{display:block;position:absolute;left:calc(-30*var(--p));top:calc(50*var(--p));width:calc(2*var(--p));height:max(calc(100% - 50*var(--p)),calc(24*var(--p)))}
.ov[data-style=spine][data-corner$=r] .item.spot .prog{left:auto;right:calc(-30*var(--p))}
.ov[data-style=spine] .prog .fill{position:absolute;left:0;top:0;width:100%;height:calc(var(--prog,0)*100%);background:linear-gradient(180deg,var(--pink),#fff)}
.ov[data-style=spine] .prog .comet{left:calc(-9*var(--p));top:calc(var(--prog,0)*100% - 12*var(--p));width:calc(20*var(--p));height:calc(26*var(--p));opacity:var(--live,0)}
.ov[data-style=spine] .item.spot.timer .prog .fill{background:rgba(255,255,255,.5);height:calc((1 - var(--prog,0))*100%)}

.ov[data-style=spine] .sweep{position:absolute;left:calc(-4*var(--p));width:calc(10*var(--p));height:calc(80*var(--p));top:0;border-radius:50%;opacity:0;
  background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(242,167,195,.4) 50%,transparent)}
.ov[data-style=spine][data-corner$=r] .sweep{left:auto;right:calc(-4*var(--p))}

@keyframes drop{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(var(--to,200px))}}

/* ======================== U2 · ONE CARD ======================== */
.cardbg{display:none;position:absolute;z-index:-1;left:calc(-30*var(--p));right:calc(-30*var(--p));top:calc(-26*var(--p));bottom:calc(-30*var(--p));border-radius:calc(28*var(--p));opacity:0;transform:scale(.985);
  transition:opacity .6s ease,transform .6s var(--ease);
  background:linear-gradient(160deg,rgba(30,26,42,.9),rgba(13,12,19,.86) 70%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.07),0 calc(36*var(--p)) calc(70*var(--p)) calc(-30*var(--p)) rgba(0,0,0,.9)}
.ov[data-style=card] .cardbg{display:block}
.ov[data-style=card].active .cardbg{opacity:1;transform:none}

  background:conic-gradient(from var(--a),transparent 0 66%,var(--pink) 76%,#fff 80%,var(--blue) 84%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

@keyframes sweep{0%{--a:0deg;opacity:0}12%{opacity:1}80%{opacity:1}100%{--a:360deg;opacity:0}}

.ov[data-style=card][data-corner$=r] .list::before{background:linear-gradient(270deg,rgba(255,255,255,.18),rgba(255,255,255,.04));align-self:stretch}

.ov[data-style=card] .item{text-shadow:none;padding:calc(10*var(--p)) 0}

/* ======================== Super Chat ticket ======================== */

  -webkit-mask-image:radial-gradient(circle calc(11*var(--p)) at 0 calc(100% - 54*var(--p)),transparent calc(10.5*var(--p)),#000 calc(11*var(--p))),radial-gradient(circle calc(11*var(--p)) at 100% calc(100% - 54*var(--p)),transparent calc(10.5*var(--p)),#000 calc(11*var(--p)));
  -webkit-mask-composite:source-in;mask-image:radial-gradient(circle calc(11*var(--p)) at 0 calc(100% - 54*var(--p)),transparent calc(10.5*var(--p)),#000 calc(11*var(--p))),radial-gradient(circle calc(11*var(--p)) at 100% calc(100% - 54*var(--p)),transparent calc(10.5*var(--p)),#000 calc(11*var(--p)));mask-composite:intersect}
.ticket .paper::before{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,236,200,.14),transparent);transform:translateX(-130%) skewX(-18deg);animation:tsheen 2.4s cubic-bezier(.4,0,.2,1) .6s both}
@keyframes tsheen{to{transform:translateX(330%) skewX(-18deg)}}
.corner{position:absolute;top:calc(13*var(--p));width:calc(18*var(--p));height:calc(18*var(--p));border:0 solid var(--tc);animation:corner .6s var(--ease) .4s both}

<body>
<div class="ov" id="ov" data-style="spine" data-corner="tl">

    <header class="mast">
      <div class="kicker"><span class="dot"></span><span class="live">LIVE</span><span class="sep">·</span><span class="day" id="day"></span><span class="time" id="time"></span></div>
      <div class="title" id="title"></div>

<script>
"use strict";
// Everything below renders as text nodes; chat never becomes HTML.
const $ = id => document.getElementById(id);
const ov = $("ov"), list = $("list"), scZone = $("sc");
const SAFE_IMG = /^https:\/\/i[0-9]\.hdslb\.com\//;
const MAX_ROWS = 4;
const state = {
  config: { style: "spine", corner: "top_left", scale: 1, vignette: .6, title: "今晚的弹幕", tagline: "", merge: true, linger_seconds: 14 },
  status: { connection: "stopped", tts: true, words: 0 },
  reading: null,           // {job_id, played_ms, queued_ms, chars, at}
  items: new Map(),        // seq -> record
  spot: null,              // seq of the spotlight item
  tickets: new Map(),      // seq -> ticket record
  lastSeq: 0,
  instance: "",
  session: null,

const corners = { top_left: "tl", top_right: "tr", bottom_left: "bl", bottom_right: "br" };
const motion = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const now = () => performance.now();

// ---------------------------------------------------------------- scale & config
function fit() {

}
function applyConfig(config) {

  ov.dataset.corner = corners[c.corner] || "tl";
  document.documentElement.style.setProperty("--vig", String(Math.min(1, Math.max(0, Number(c.vignette) || 0))));

  refreshTagline();
  layoutChanged();
  trim();
  ensureLoop();
}

// ---------------------------------------------------------------- masthead
function clock() {
  const d = new Date();
  $("day").textContent = d.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();
  $("time").textContent = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function connected() { return state.status.connection === "connected"; }
function taglineContent() {
  const s = state.status;
  if (s.connection === "reconnecting" || s.connection === "connecting") return ["reconnecting…"];
  if (s.connection === "session_expired") return ["signed out — reconnecting soon."];
  if (s.connection === "stopped") return ["standing by."];
  const reading = state.reading && [...state.items.values(), ...state.tickets.values()].some(r => r.job === state.reading.job_id);
  if (reading || [...state.items.values()].some(r => r.demoUntil)) return ["now reading."];
  const visible = [...state.items.values()].some(r => !r.leaving);
  if (visible && s.words > 0) return [{ num: Number(s.words).toLocaleString("en-US") }, s.words === 1 ? " word tonight." : " words tonight."];
  if (state.config.tagline) return [state.config.tagline];
  return [s.tts ? "say a word — it’ll be read aloud." : "danmaku only, tonight."];
}
let taglineKey = "";
function refreshTagline() {
  const parts = taglineContent();
  const key = JSON.stringify(parts);
  ov.classList.toggle("connected", connected());
  ov.classList.toggle("disconnected", !connected());
  ov.classList.toggle("tts-off", !state.status.tts);
  if (key === taglineKey) return;
  taglineKey = key;
  const node = $("tagline");
  const paint = () => {
    node.textContent = "";

  node.classList.add("swap");

}

// ---------------------------------------------------------------- rendering
function face(viewer, avatar) {

  const f = h("span", "face");
  const x = hue(viewer), h1 = x % 360, h2 = (h1 + 40 + (x >> 9) % 60) % 360;
  f.style.setProperty("--c1", `hsl(${h1} 70% 84%)`);
  f.style.setProperty("--c2", `hsl(${h2} 62% 72%)`);
  wrap.append(f);
  if (avatar && SAFE_IMG.test(avatar)) {
    const img = h("img"); img.alt = ""; img.referrerPolicy = "no-referrer"; img.decoding = "async";
    img.onerror = () => img.remove(); img.src = avatar; wrap.append(img);

}
function emoteImage(kind, emote) {
  const img = h("img", kind);
  img.alt = ""; img.setAttribute("aria-label", emote.text); img.referrerPolicy = "no-referrer";
  img.onerror = () => {
    const fallback = h("span", `${kind} emote-unavailable`);
    fallback.setAttribute("role", "img"); fallback.setAttribute("aria-label", emote.text);
    fallback.style.display = kind === "sticker" ? "block" : "inline-block";
    fallback.style.width = fallback.style.height = kind === "sticker" ? "calc(96 * var(--p))" : "1.45em";
    fallback.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 6"/></svg>';
    img.replaceWith(fallback);
  };

  return img;
}
function messageNodes(item, target) {
  const msg = String(item.message || "");
  const emotes = (Array.isArray(item.emotes) ? item.emotes : []).slice(0, 32).filter(e => {
    if (!e || typeof e.text !== "string" || !e.text || !SAFE_IMG.test(e.url || "")) return false;
    try {
      const url = new URL(e.url);
      return url.protocol === "https:" && /^i\d+\.hdslb\.com$/i.test(url.hostname) && !url.port && !url.username && !url.password && url.pathname.startsWith("/bfs/") && !/\.svg(?:$|@)/i.test(url.pathname);

  while (i < msg.length) {
    const e = emotes.find(e => msg.startsWith(e.text, i));

}
function textKey(item) { return String(item.message || "").replace(/\s+/g, "").toLowerCase(); }

function buildItem(item) {
  const el = h("div", "item");
  el.dataset.kind = item.kind;
  el.append(h("span", "aura"));
  const av = h("div", "av"); av.append(h("span", "ring"), face(item.viewer, item.avatar));
  const body = h("div", "body");
  const meta = h("div", "meta");
  if (item.kind === "gift") meta.append(h("span", "label", "GIFT"));
  if (item.kind === "guard") meta.append(h("span", "label", item.guard || "舰长"));
  if (item.name) meta.append(h("span", "name", item.name));
  const text = h("div", "text");
  const lit = h("span", "lit");
  if (item.kind === "gift") {
    lit.append(item.gift || "礼物");

  } else if (item.kind === "guard") {
    lit.append("加入了舰队");
  } else {
    messageNodes(item, lit);
  }
  text.append(lit, h("span", "count"));
  body.append(meta, text);
  const prog = h("div", "prog"); prog.append(h("i", "fill"), h("i", "comet"));
  el.append(av, body, prog);

}

// ---------------------------------------------------------------- items
function lingerMs() { return Math.max(3, Number(state.config.linger_seconds) || 14) * 1000; }
function retainsRows() { return ov.dataset.style === "spine"; }
function spotHoldMs(rec) { return Math.min(lingerMs(), 4500 + 140 * [...String(rec.item.message || "")].length); }

// Busy rooms: at most one new line every 300 ms. Lines that will be read are
// never dropped; display-only lines beyond a short backlog are skipped.
function receive(item) {
  if (!item || (item.session != null && item.session !== state.session) || !item.seq || item.seq <= state.lastSeq) return;
  state.lastSeq = item.seq;
  if (item.kind === "super_chat") return addTicket(item);
  state.inbox.push(item);
  if (state.inbox.length > 6) {
    const index = state.inbox.findIndex(entry => entry.job_id == null);
    if (index >= 0) state.inbox.splice(index, 1);
  }

}
let pumpTimer = 0, lastInsert = 0;
function pump() {
  if (pumpTimer || !state.inbox.length) return;
  const wait = Math.max(0, lastInsert + 300 - now());
  pumpTimer = setTimeout(() => {
    pumpTimer = 0; lastInsert = now();
    addItem(state.inbox.shift());
    pump();
  }, wait);
}

function addItem(item, restoring = false) {
  if (!item) return;
  if (item.kind === "super_chat") return addTicket(item);
  // A long queued job can be restored after falling out of the server cache
  // while its original pending row is still on screen. Keep that same row.
  if (item.job_id != null && [...state.items.values()].some(rec => !rec.leaving && rec.job === item.job_id)) return;
  // Spam that will not be read merges into the matching line on screen.
  if (state.config.merge && item.kind === "danmaku" && item.job_id == null && textKey(item)) {
    for (const rec of state.items.values()) {
      if (!rec.leaving && rec.item.kind === "danmaku" && rec.job == null && textKey(rec.item) === textKey(item)) {
        rec.count += 1;
        rec.el.querySelector(".count").textContent = `×${rec.count}`;
        rec.el.classList.remove("bump"); void rec.el.offsetWidth; rec.el.classList.add("bump");
        rec.expires = now() + lingerMs();

    seq: item.seq, item, el: buildItem(item), job: item.job_id ?? null, count: 1, leaving: false,
    born: now(), expires: now() + lingerMs(), state: restoring ? "done" : item.job_id != null ? "pending" : "none",
    demoUntil: item.demo_read_ms ? now() + 700 + item.demo_read_ms : 0, demoStart: item.demo_read_ms ? now() + 700 : 0,

  if (restoring) {
    if (state.reading && rec.job === state.reading.job_id) { rec.state = "reading"; setSpot(rec, "reading"); }
    markRecent();

  refreshTagline();

}

function readingRecord() {
  const r = state.reading;
  if (r) for (const rec of state.items.values()) if (rec.job === r.job_id && !rec.leaving) return rec;
  for (const rec of state.items.values()) if (rec.demoUntil && now() < rec.demoUntil) return rec;
  return null;
}

function setSpot(rec, mode) {
  const previous = state.spot != null ? state.items.get(state.spot) : null;
  flip(() => {
    if (previous && previous !== rec) demote(previous);
    if (rec) {
      state.spot = rec.seq;
      rec.el.classList.add("spot");
      rec.el.classList.toggle("timer", mode === "timer");
      rec.el.classList.toggle("reading", mode === "reading");

      rec.spotAt = now();

  const rows = [...state.items.values()].filter(r => r !== rec && !r.leaving && r.seq > rec.seq && r.el.parentNode === list);
  const anchor = rows.sort((a, b) => a.seq - b.seq).map(r => r.el)[0];

function setLit(rec, fraction) {

}
function settle(rec) {

function trim() {
  const alive = [...state.items.values()].filter(r => !r.leaving).sort((a, b) => b.seq - a.seq);

function depth() {
  const rows = [...list.children].filter(el => !el.classList.contains("out") && !el.classList.contains("spot"));
  const fade = [1, .72, .5, .36, .26];

// FLIP keeps rows sliding instead of jumping when the list changes.
function flip(mutate) {

  } else {

// ---------------------------------------------------------------- Super Chat
const SC_SECONDS = [[2000, 7200], [1000, 3600], [500, 1800], [100, 300], [50, 120], [0, 60]];
function scDuration(price) { for (const [min, s] of SC_SECONDS) if (price >= min) return s * 1000; return 60000; }

function addTicket(item) {
  const price = Math.max(0, Math.round(Number(item.price) || 0));

  el.dataset.tier = tier(price);

  paper.append(h("span", "corner l"), h("span", "corner r"), h("div", "tname", item.name || ""));
  const ttext = h("div", "ttext"); const lit = h("span", "lit"); messageNodes(item, lit); ttext.append(lit);
  paper.append(ttext, h("div", "tperf"));
  const foot = h("div", "tfoot"); const track = h("span", "ttrack"); track.append(h("i"));
  foot.append(h("span", "tlabel", "SUPER CHAT"), track, h("span", "tprice", `¥${price}`));
  paper.append(foot);
  const medal = h("div", "medal"); medal.append(face(item.viewer, item.avatar));
  const stub = h("div", "stubbar");
  const sav = h("span", "sav"); sav.append(face(item.viewer, item.avatar));
  const strack = h("span", "strack"); strack.append(h("i"));
  stub.append(sav, h("span", "sprice", `¥${price}`), h("span", "scut"), h("span", "stext", String(item.message || "")), h("span", "sleft"), strack);
  el.append(paper, medal, stub);
  const rec = { seq: item.seq, item, el, job: item.job_id ?? null, start: now(), total: scDuration(price), open: true,
    demoUntil: item.demo_read_ms ? now() + 900 + item.demo_read_ms : 0, demoStart: item.demo_read_ms ? now() + 900 : 0 };
  setTicketLit(rec, rec.job != null || rec.demoUntil ? 0 : 1);
  state.tickets.set(rec.seq, rec);
  scZone.prepend(el);
  // Only one full ticket at a time; older ones fold into stubs.
  for (const other of state.tickets.values()) if (other !== rec && other.open) fold(other);
  const stubs = [...state.tickets.values()].filter(r => !r.open).sort((a, b) => b.seq - a.seq);

function setTicketLit(rec, fraction) { rec.el.querySelector(".ttext .lit").style.setProperty("--lit", `${Math.min(100, Math.max(0, fraction * 100))}%`); }
function fold(rec) { rec.open = false; rec.el.classList.remove("reading"); rec.el.classList.add("stub"); setTicketLit(rec, 1); }
function dropTicket(rec) {
  state.tickets.delete(rec.seq);
  rec.el.classList.add("out");
  setTimeout(() => rec.el.remove(), 650);
}

// ---------------------------------------------------------------- reading sync
// The app reports the real output position: audio already heard and decoded
// audio still queued. The total length is unknown while synthesis streams,
// so it is estimated from the text and corrected by the queued audio.
function readingFraction() {
  const r = state.reading;
  if (!r) return null;
  const elapsed = now() - r.at;
  const heard = r.played_ms + Math.min(elapsed, r.queued_ms);
  const remaining = Math.max(0, r.queued_ms - elapsed);

  const total = Math.max(estimate, heard + remaining);
  return Math.min(.985, heard / total);

  const previous = state.reading;
  state.reading = reading && reading.job_id != null ? { ...reading, at: now() } : null;
  if (previous && (!state.reading || previous.job_id !== state.reading.job_id)) finishJob(previous.job_id);
  if (state.reading) {
    const rec = [...state.items.values()].find(r => r.job === state.reading.job_id && !r.leaving);
    if (rec && (state.spot !== rec.seq || rec.spotMode !== "reading")) { rec.state = "reading"; setSpot(rec, "reading"); }
    const ticket = [...state.tickets.values()].find(r => r.job === state.reading.job_id);
    if (ticket) ticket.el.classList.add("reading");
  }
  refreshTagline();
  ensureLoop();
}
function finishJob(job) {
  const rec = [...state.items.values()].find(r => r.job === job && !r.leaving);
  if (rec) {
    rec.state = "done";
    rec.el.style.setProperty("--prog", "1");
    rec.el.style.setProperty("--live", "0");
    setLit(rec, 1);
    rec.el.classList.remove("reading");
    rec.expires = now() + lingerMs();
    // Stay large for a breath, then fold back into the list.
    setTimeout(() => { if (state.spot === rec.seq && !readingRecord()) settle(rec); }, 1600);
  }
  const ticket = [...state.tickets.values()].find(r => r.job === job);
  if (ticket) { ticket.el.classList.remove("reading"); setTicketLit(ticket, 1); ticket.readDone = now(); }
}

// ---------------------------------------------------------------- frame loop
let loopRunning = false;
let loopTimer = 0;
function ensureLoop() {
  clearTimeout(loopTimer); loopTimer = 0;
  if (!loopRunning) { loopRunning = true; requestAnimationFrame(frame); }
}
function frame() {
  const t = now();
  let busy = false;
  let nextWake = Infinity;
  const fraction = readingFraction();
  for (const rec of state.items.values()) {
    if (rec.leaving) continue;
    if (state.reading && rec.job === state.reading.job_id && fraction != null) {
      rec.el.style.setProperty("--prog", fraction.toFixed(4));
      rec.el.style.setProperty("--live", "1");
      setLit(rec, fraction);
      busy = true;
    } else if (rec.demoUntil) {
      if (t < rec.demoStart) { nextWake = Math.min(nextWake, rec.demoStart - t); }
      else if (t < rec.demoUntil) {
        if (rec.spotMode !== "reading" && state.spot === rec.seq) { rec.el.classList.remove("timer"); rec.el.classList.add("reading"); rec.spotMode = "reading"; }
        const f = (t - rec.demoStart) / (rec.demoUntil - rec.demoStart);
        rec.el.style.setProperty("--prog", f.toFixed(4)); rec.el.style.setProperty("--live", "1"); setLit(rec, f); busy = true;
      } else {
        rec.demoUntil = 0; rec.el.style.setProperty("--prog", "1"); rec.el.style.setProperty("--live", "0"); setLit(rec, 1); rec.el.classList.remove("reading");
        rec.expires = t + lingerMs();
        setTimeout(() => { if (state.spot === rec.seq && !readingRecord()) settle(rec); }, 1600);
      }
    } else if (state.spot === rec.seq && rec.spotMode === "timer") {
      const f = (t - rec.spotAt) / spotHoldMs(rec);
      rec.el.style.setProperty("--prog", Math.min(1, f).toFixed(4));
      if (f >= 1) settle(rec);
      else busy = true;
    } else if (state.spot === rec.seq && rec.spotMode === "waiting" && t - rec.spotAt > 20000) {
      // Queued behind a long read: give the spotlight back.
      settle(rec);
    }
    if (!retainsRows()) {
      if (t > rec.expires && state.spot !== rec.seq && rec.state !== "reading") remove(rec);
      else if (t <= rec.expires) nextWake = Math.min(nextWake, rec.expires - t + 1);
    }
    if (state.spot === rec.seq && rec.spotMode === "waiting") nextWake = Math.min(nextWake, rec.spotAt + 20001 - t);
  }
  for (const rec of state.tickets.values()) {
    const left = Math.max(0, 1 - (t - rec.start) / rec.total);
    const progress = left.toFixed(4);
    // Preserve the original four-decimal progress and frame rate, but do not
    // rewrite an identical style while a long ticket waits for the next step.
    if (rec.progress !== progress) {
      rec.el.style.setProperty("--left", progress);
      rec.progress = progress;
    }
    const remaining = Math.ceil((rec.total - (t - rec.start)) / 1000);
    const remainingText = remaining >= 60 ? `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, "0")}` : `0:${String(Math.max(0, remaining)).padStart(2, "0")}`;
    // The progress track stays frame-synchronized; its second label does not
    // need another DOM lookup and text assignment on every frame.
    if (rec.remainingText !== remainingText) {
      rec.el.querySelector(".sleft").textContent = remainingText;
      rec.remainingText = remainingText;
    }
    if (state.reading && rec.job === state.reading.job_id && fraction != null) setTicketLit(rec, fraction);
    else if (rec.demoUntil) {
      if (t >= rec.demoStart && t < rec.demoUntil) { rec.el.classList.add("reading"); setTicketLit(rec, (t - rec.demoStart) / (rec.demoUntil - rec.demoStart)); }
      else if (t >= rec.demoUntil) { rec.demoUntil = 0; rec.readDone = t; rec.el.classList.remove("reading"); setTicketLit(rec, 1); }
    }
    const openFor = rec.readDone ? t - rec.readDone : (rec.job == null && !rec.demoUntil ? t - rec.start - 9000 : -1);
    if (rec.open && openFor > 3000) fold(rec);
    if (left <= 0) dropTicket(rec);
    busy = true;
  }
  if (busy) requestAnimationFrame(frame);
  else {
    loopRunning = false;
    // Expiry and queued-reading deadlines are timers, not animated work.
    // New items/readings cancel this wait and immediately request a frame.
    if (Number.isFinite(nextWake)) loopTimer = setTimeout(ensureLoop, Math.max(1, nextWake));
  }
}

// ---------------------------------------------------------------- connection
const token = new URLSearchParams(location.search).get("token") || "";
let source = null, sizeTimer = 0, recoveryTimer = 0, watchdogTimer = 0;
let retryAttempt = 0, connectionStopped = false, tokenRevoked = false;
const SOURCE_CHECK_MS = 5000, SOURCE_IDLE_MS = 45000;
function stopConnection(revoked = false) {
  tokenRevoked ||= revoked;
  connectionStopped = true;
  clearTimeout(sizeTimer); sizeTimer = 0;
  clearTimeout(recoveryTimer); recoveryTimer = 0;
  clearTimeout(watchdogTimer); watchdogTimer = 0;
  const previous = source; source = null;
  previous?.close();
}
function recoverConnection() {
  if (!token || connectionStopped || tokenRevoked || recoveryTimer) return;
  clearTimeout(watchdogTimer); watchdogTimer = 0;
  if (source && source.readyState !== EventSource.CLOSED) source.close();
  state.status = { ...state.status, connection: "reconnecting" };
  refreshTagline();
  const delay = Math.min(30000, 1000 * 2 ** retryAttempt);
  retryAttempt = Math.min(5, retryAttempt + 1);
  recoveryTimer = setTimeout(() => { recoveryTimer = 0; connect(); }, delay);
}
function connect() {
  if (!token || connectionStopped || tokenRevoked) return;
  clearTimeout(sizeTimer); sizeTimer = 0;
  clearTimeout(recoveryTimer); recoveryTimer = 0;
  clearTimeout(watchdogTimer); watchdogTimer = 0;
  const previous = source; source = null;
  previous?.close();
  const query = new URLSearchParams({ token, w: String(innerWidth), h: String(innerHeight) });
  let current;
  try { current = new EventSource(`/overlay/events?${query}`); }
  catch { recoverConnection(); return; }
  source = current;
  let lastFrameAt = now(), helloReceived = false, heartbeatTimeout = 0;
  const active = () => source === current && !connectionStopped && !tokenRevoked;
  const listen = (name, handler) => current.addEventListener(name, e => {
    if (!active() || (recoveryTimer && name !== "reset")) return;
    lastFrameAt = now();
    handler(e);
  });
  const watch = () => {
    watchdogTimer = 0;
    if (!active()) return;
    if (current.readyState === EventSource.CLOSED) { recoverConnection(); return; }
    // CONNECTING owns the browser's normal retry loop. OPEN without a hello,
    // or without the server's advertised heartbeat, can otherwise stay stuck.
    const idleLimit = helloReceived ? heartbeatTimeout : SOURCE_IDLE_MS;
    if (current.readyState === EventSource.OPEN && idleLimit && now() - lastFrameAt >= idleLimit) {
      recoverConnection(); return;
    }
    watchdogTimer = setTimeout(watch, SOURCE_CHECK_MS);
  };
  watchdogTimer = setTimeout(watch, SOURCE_CHECK_MS);
  current.onopen = () => { if (active()) lastFrameAt = now(); };
  listen("hello", e => {
    const data = JSON.parse(e.data);
    if (data.instance === state.instance && data.session != null && state.session != null && data.session < state.session) return;
    helloReceived = true;
    retryAttempt = 0;
    // Older servers only sent SSE comments, which EventSource cannot observe.
    const heartbeatMs = Number(data.heartbeat_ms);
    heartbeatTimeout = Number.isFinite(heartbeatMs) && heartbeatMs > 0
      ? Math.max(SOURCE_IDLE_MS, Math.min(300000, heartbeatMs * 3)) : 0;
    if (data.instance !== state.instance || (data.session != null && data.session !== state.session)) {
      // A new app or receiving/broadcast session cannot retain old rows.
      clearOverlay();
      state.instance = data.instance;
      state.session = data.session ?? null;
      state.lastSeq = 0;
    }
    applyConfig(data.config || {});
    state.status = { ...state.status, ...(data.status || {}) };
    setReading(data.reading);
    for (const item of data.items || []) {
      if (retainsRows() && item.kind !== "super_chat") restoreItem(item);
      else if (Date.now() - (item.at || 0) < lingerMs()) receive(item);
    }
    const active = readingRecord();
    if (retainsRows() && active) setSpot(active, "reading");
    ov.classList.add("ready");
  });
  listen("heartbeat", () => {});
  listen("config", e => applyConfig(JSON.parse(e.data)));
  listen("status", e => { state.status = { ...state.status, ...JSON.parse(e.data) }; refreshTagline(); });
  listen("item", e => receive(JSON.parse(e.data)));
  listen("reading", e => setReading(JSON.parse(e.data)));
  listen("clear", e => {
    const session = JSON.parse(e.data).session;
    // A reconnect hello can already include this boundary and its newer rows.
    if (session != null && state.session != null && session <= state.session) return;
    clearOverlay();
    if (session != null) state.session = session;
  });
  // The streamer created a new address: this page stops showing chat.
  listen("reset", () => { stopConnection(true); ov.classList.remove("ready"); });
  current.onerror = () => {
    if (!active() || recoveryTimer) return;
    state.status = { ...state.status, connection: "reconnecting" }; refreshTagline();
    if (current.readyState === EventSource.CLOSED) recoverConnection();
  };
}
addEventListener("resize", () => {
  fit();
  if (!token || connectionStopped || tokenRevoked) return;
  clearTimeout(sizeTimer); sizeTimer = setTimeout(connect, 800);
});
addEventListener("pagehide", () => stopConnection());
addEventListener("pageshow", e => {
  if (!e.persisted || !connectionStopped || tokenRevoked) return;
  connectionStopped = false; retryAttempt = 0; connect();
});
clock(); setInterval(clock, 10000);
fit(); refreshTagline();
if (token) connect();
</script>
</body>
</html>
