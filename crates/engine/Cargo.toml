[package]
name = "danmakuvoice-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
# Keep the lean TLS backend, but retain Windows Internet Settings proxy support.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
futures-util = "0.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
sha2 = "0.10"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
cpal = "0.18.2"
crossbeam-queue = "0.3"
zeroize = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
brotli = "9"
flate2 = "1.1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Registry"] }
